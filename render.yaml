services:
  - type: web
    name: edubest-api
    runtime: python
    buildCommand: "cd backend && pip install -r requirements/production.txt && python manage.py collectstatic --noinput --settings=config.settings.production"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edubest-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://edubest-platform.vercel.app"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECURE_SSL_REDIRECT
        value: "false"

databases:
  - name: edubest-db
    databaseName: edubest
    user: edubest
    plan: free
