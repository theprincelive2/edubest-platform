# ============================================================
# Nginx Configuration - Development (Subdomain Routing)
# ============================================================
# Handles:
#   - localhost     → Next.js frontend (public site)
#   - localhost/api → Django backend (API)
#   - *.localhost   → Tenant-specific routing (Django)
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request ID for tracing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Upstream servers
    upstream django {
        server web:8000;
    }

    upstream nextjs {
        server frontend:3000;
    }

    # ----------------------------------------------------------------
    # Main server block
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Serve static files directly (Django)
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Serve media files
        location /media/ {
            alias /var/www/media/;
            expires 7d;
        }

        # API routes → Django
        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $host;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # CORS headers (handled by Django, but set here as fallback)
            add_header X-Request-ID $request_id;
        }

        # Django admin
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other routes → Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ----------------------------------------------------------------
    # Wildcard subdomain server (tenant routing) - dev uses port 8080
    # In dev: access school via http://schoolname.localhost:8080
    # ----------------------------------------------------------------
    server {
        listen 8080;
        server_name ~^(?<tenant>[a-z0-9-]+)\.localhost$;

        # Forward the tenant subdomain to Django as a header
        set $tenant_name $tenant;

        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Tenant-Subdomain $tenant_name;
        }

        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Tenant-Subdomain $tenant_name;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
